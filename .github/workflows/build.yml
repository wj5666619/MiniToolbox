name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required files
        shell: pwsh
        run: |
          $missing = @('定时关机.cs','定时关机.ico','皮肤.txt','sam_tool.zip','clean_tool.zip',
            'refs\WV2Core.dll','refs\WV2WinForms.dll','refs\WV2Loader32.dll','refs\WV2Loader64.dll','build.ps1') |
            Where-Object { -not (Test-Path $_) }
          if ($missing.Count -gt 0) { throw "缺少构建文件: $($missing -join ', ')" }
          if (-not (Test-Path 'Src')) { throw "缺少 Src 目录" }

      - name: Compile (csc / .NET Framework 4)
        shell: pwsh
        run: |
          $csc = "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          $fw  = "C:\Windows\Microsoft.NET\Framework64\v4.0.30319"
          $cscArgs = @("/nologo","/target:winexe","/optimize+","/codepage:65001",
            "/r:System.IO.Compression.dll","/r:System.IO.Compression.FileSystem.dll","/r:System.Web.Extensions.dll",
            "/r:Accessibility.dll","/r:$fw\System.Management.dll","/r:$fw\WPF\UIAutomationClient.dll",
            "/r:$fw\WPF\UIAutomationTypes.dll","/r:$fw\WPF\WindowsBase.dll","/r:$fw\WPF\System.Speech.dll",
            "/r:System.Security.dll","/r:Microsoft.VisualBasic.dll",
            "/r:refs\WV2Core.dll","/r:refs\WV2WinForms.dll",
            "/win32icon:定时关机.ico",
            "/resource:sam_tool.zip,SamZip","/resource:clean_tool.zip,CleanZip",
            "/resource:refs\WV2Core.dll,WV2Core",
            "/resource:refs\WV2WinForms.dll,WV2WinForms",
            "/resource:refs\WV2Loader32.dll,WV2Loader32",
            "/resource:refs\WV2Loader64.dll,WV2Loader64",
            "/out:小工具箱.exe","定时关机.cs")
          $cscArgs += @(Get-ChildItem Src\*.cs | ForEach-Object { $_.FullName })
          & $csc @cscArgs
          if ($LASTEXITCODE -ne 0) { throw "csc failed" }

      - name: Sign (optional)
        shell: pwsh
        env:
          CERT_PFX_BASE64: ${{ secrets.CERT_PFX_BASE64 }}
          CERT_PASS: ${{ secrets.CERT_PASS }}
        if: env.CERT_PFX_BASE64 != ''
        run: |
          [IO.File]::WriteAllBytes("cert.pfx", [Convert]::FromBase64String($env:CERT_PFX_BASE64))
          $signtool = "C:\Program Files (x86)\Windows Kits\10\App Certification Kit\signtool.exe"
          if (-not (Test-Path $signtool)) { throw "signtool 不存在" }
          & $signtool sign /f cert.pfx /p $env:CERT_PASS /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 小工具箱.exe
          if ($LASTEXITCODE -ne 0) { throw "签名失败" }
          Remove-Item cert.pfx -Force

      - name: Checksum / manifest / package
        shell: pwsh
        run: |
          $ver = (Select-String -Path Src\UiKit.cs -Pattern 'VER\s*=\s*"([0-9.]+)"').Matches[0].Groups[1].Value
          $hash = (Get-FileHash 小工具箱.exe -Algorithm SHA256).Hash.ToLower()
          $size = (Get-Item 小工具箱.exe).Length
          @{
            version = $ver
            size = $size
            sha256 = $hash
            url = "https://github.com/wj5666619/MiniToolbox/releases/latest/download/MiniToolbox.exe"
            notes = @("CI 构建 v$ver", "构建产物请以 Release 资产为准")
          } | ConvertTo-Json -Depth 4 | Out-File update.json -Encoding utf8

          $sevenZip = "C:\Program Files\7-Zip\7z.exe"
          if (Test-Path $sevenZip) {
            & $sevenZip a -t7z -mx=9 "MiniToolbox_v$ver.7z" 小工具箱.exe 皮肤.txt | Out-Null
          } else {
            Compress-Archive -Path 小工具箱.exe,皮肤.txt -DestinationPath "MiniToolbox_v$ver.zip" -Force
          }
          "VERSION=$ver" | Out-File build-info.txt -Encoding utf8
          "SIZE=$size" | Out-File build-info.txt -Encoding utf8 -Append
          "SHA256=$hash" | Out-File build-info.txt -Encoding utf8 -Append

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiniToolbox-${{ github.sha }}
          path: |
            小工具箱.exe
            MiniToolbox_v*.*
            update.json
            build-info.txt
          if-no-files-found: error
          retention-days: 14

      - name: Verify tag matches source version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $ver = (Select-String -Path Src\UiKit.cs -Pattern 'VER\s*=\s*"([0-9.]+)"').Matches[0].Groups[1].Value
          $tag = "${{ github.ref_name }}".TrimStart('v')
          if ($tag -ne $ver) { throw "tag v$tag 与源码 VER=$ver 不一致" }

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            小工具箱.exe
            MiniToolbox_v*.*
            update.json
            build-info.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
