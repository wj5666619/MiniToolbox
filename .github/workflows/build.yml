name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: compile
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check required files
        shell: pwsh
        run: |
          $missing = @('定时关机.cs','定时关机.ico','皮肤.txt','sam_tool.zip','clean_tool.zip',
            'refs\WV2Core.dll','refs\WV2WinForms.dll','refs\WV2Loader32.dll','refs\WV2Loader64.dll','build.ps1') |
            Where-Object { -not (Test-Path -LiteralPath $_) }
          if ($missing.Count -gt 0) { throw "缺少构建文件: $($missing -join ', ')" }
          if (-not (Test-Path -LiteralPath 'Src')) { throw "缺少 Src 目录" }
          if (-not (Test-Path -LiteralPath 'tools\New-Sbom.ps1')) { throw "缺少 SBOM 生成脚本" }

      - name: Build from source
        shell: pwsh
        run: |
          .\build.ps1 -NoSign -NoPack
          if (-not (Test-Path -LiteralPath '小工具箱.exe')) { throw "构建未产出 小工具箱.exe" }

      - name: Version / hash / manifest
        shell: pwsh
        run: |
          $ver = (Select-String -LiteralPath 'Src\UiKit.cs' -Pattern 'VER\s*=\s*"([0-9.]+)"').Matches[0].Groups[1].Value
          $exe = Get-Item -LiteralPath '小工具箱.exe'
          $hash = (Get-FileHash -LiteralPath $exe.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          @{
            version = $ver
            size    = $exe.Length
            sha256  = $hash
            url     = "https://github.com/wj5666619/MiniToolbox/releases/latest/download/MiniToolbox.exe"
            notes   = @("CI 构建 v$ver", "构建来源与 SBOM 见 Release 资产")
          } | ConvertTo-Json -Depth 5 | Out-File -LiteralPath 'update.json' -Encoding utf8NoBOM

          @(
            "VERSION=$ver"
            "SIZE=$($exe.Length)"
            "SHA256=$hash"
            "COMMIT=${{ github.sha }}"
            "RUN=${{ github.run_id }}"
            "BUILD_AT=$((Get-Date).ToUniversalTime().ToString('o'))"
          ) | Out-File -LiteralPath 'build-info.txt' -Encoding utf8NoBOM

          pwsh -NoProfile -ExecutionPolicy Bypass -File tools\New-Sbom.ps1 -Exe 小工具箱.exe -Version $ver -Output sbom.cdx.json
          if ($LASTEXITCODE -ne 0) { throw "SBOM 生成失败" }

      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: minitoolbox-build
          path: |
            小工具箱.exe
            update.json
            build-info.txt
            sbom.cdx.json
          if-no-files-found: error
          retention-days: 14

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: compile
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: minitoolbox-build
          path: dist

      - name: Prepare dist and verify tag
        shell: pwsh
        run: |
          $ver = (Select-String -LiteralPath 'dist\build-info.txt' -Pattern '^VERSION=([0-9.]+)').Matches[0].Groups[1].Value
          $tag = "${{ github.ref_name }}".TrimStart('v')
          if ($tag -ne $ver) { throw "tag v$tag 与构建版本 v$ver 不一致" }
          Copy-Item -LiteralPath 'dist\小工具箱.exe' -Destination 'dist\MiniToolbox.exe' -Force
          "RELEASE_VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8NoBOM -Append

      - name: Sign (optional)
        shell: pwsh
        env:
          CERT_PFX_BASE64: ${{ secrets.CERT_PFX_BASE64 }}
          CERT_PASS: ${{ secrets.CERT_PASS }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CERT_PFX_BASE64)) {
            Write-Warning "未配置 CERT_PFX_BASE64，发布包未签名；企业分发前请用可信证书重签。"
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'cert.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_PFX_BASE64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue |
            Sort-Object FullName | Select-Object -Last 1
          if (-not $signtool) { throw "signtool 不存在" }
          & $signtool.FullName sign /f $pfx /p $env:CERT_PASS /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 'dist\MiniToolbox.exe'
          if ($LASTEXITCODE -ne 0) { throw "签名失败" }
          Remove-Item -LiteralPath $pfx -Force
          $sig = Get-AuthenticodeSignature -LiteralPath 'dist\MiniToolbox.exe'
          if ($sig.Status -eq 'NotSigned') { throw "签名后仍为未签名" }
          "SIGNER=$($sig.SignerCertificate.Subject)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8NoBOM -Append
          "CERT_THUMBPRINT=$($sig.SignerCertificate.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8NoBOM -Append

      - name: Checksum / manifest / package / SBOM
        shell: pwsh
        run: |
          $ver = $env:RELEASE_VERSION
          $exe = Get-Item -LiteralPath 'dist\MiniToolbox.exe'
          $hash = (Get-FileHash -LiteralPath $exe.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          @{
            version = $ver
            size    = $exe.Length
            sha256  = $hash
            url     = "https://github.com/wj5666619/MiniToolbox/releases/latest/download/MiniToolbox.exe"
            notes   = @("CI 发布 v$ver", "SHA256 与 SBOM 见 Release 资产", "构建来源由 GitHub Actions 证明")
          } | ConvertTo-Json -Depth 5 | Out-File -LiteralPath 'dist\update.json' -Encoding utf8NoBOM

          $seven = "C:\Program Files\7-Zip\7z.exe"
          $pkg = "dist\MiniToolbox_v$ver.7z"
          if (Test-Path -LiteralPath $seven) {
            & $seven a -t7z -mx=9 $pkg 'dist\MiniToolbox.exe' '皮肤.txt' | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "7z 打包失败" }
          } else {
            $pkg = "dist\MiniToolbox_v$ver.zip"
            Compress-Archive -Path 'dist\MiniToolbox.exe','皮肤.txt' -DestinationPath $pkg -Force
          }

          pwsh -NoProfile -ExecutionPolicy Bypass -File tools\New-Sbom.ps1 -Exe dist\MiniToolbox.exe -Version $ver -Output dist\sbom.cdx.json
          if ($LASTEXITCODE -ne 0) { throw "SBOM 生成失败" }

          $assets = @('dist\MiniToolbox.exe', $pkg)
          if (Test-Path -LiteralPath 'docs\ToolSite.zip') { Copy-Item -LiteralPath 'docs\ToolSite.zip' -Destination 'dist\ToolSite.zip' -Force; $assets += 'dist\ToolSite.zip' }
          $assets += 'dist\update.json','dist\sbom.cdx.json','dist\build-info.txt'

          $lines = foreach ($p in $assets) {
            $h = (Get-FileHash -LiteralPath $p -Algorithm SHA256).Hash.ToLowerInvariant()
            "$h  $([IO.Path]::GetFileName($p))"
          }
          $lines | Out-File -LiteralPath 'dist\SHA256SUMS.txt' -Encoding ascii

          "RELEASE_HASH=$hash" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8NoBOM -Append

      - name: Attest core build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/MiniToolbox.exe
            dist/MiniToolbox_v*
          github-token: ${{ github.token }}

      - name: Attest optional tool site provenance
        if: ${{ hashFiles('dist/ToolSite.zip') != '' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/ToolSite.zip
          github-token: ${{ github.token }}

      - name: Create or update release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $title = "小工具箱 $tag"
          $pkg = Get-ChildItem -LiteralPath 'dist' -File | Where-Object { $_.Name -like 'MiniToolbox_v*.*' } | Select-Object -First 1
          if (-not $pkg) { throw "缺少发布压缩包" }
          $files = @('dist\MiniToolbox.exe', $pkg.FullName, 'dist\update.json','dist\sbom.cdx.json','dist\build-info.txt','dist\SHA256SUMS.txt')
          if (Test-Path -LiteralPath 'dist\ToolSite.zip') { $files += 'dist\ToolSite.zip' }

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @files --clobber
            if ($LASTEXITCODE -ne 0) { throw "Release 资产上传失败" }
            gh release edit $tag --title $title
          } else {
            gh release create $tag --title $title --generate-notes
            if ($LASTEXITCODE -ne 0) { throw "Release 创建失败" }
            gh release upload $tag @files --clobber
            if ($LASTEXITCODE -ne 0) { throw "Release 资产上传失败" }
          }
